[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaco-modbus"
description = "Read and control KACO solar inverters over SunSpec Modbus."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Gabriel Lackermeier", email = "g.lackermeier@gmail.com" }]
keywords = ["kaco", "modbus", "sunspec", "solar", "inverter", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dynamic = ["version"]

# No backend extra on purpose: this library only ever receives a ModbusUnit,
# so the caller picks tmodbus or pymodbus. Pinning one here would force that
# choice on every consumer and defeat the point of the abstraction.
dependencies = ["modbus-connection>=4.8.1,<5"]

[project.optional-dependencies]
# Only the CLIs need to open a connection of their own, or to render anything.
cli = ["modbus-connection[tmodbus]>=4.8.1,<5", "rich>=13.7"]

[project.urls]
Homepage = "https://github.com/g4bri3lDev/kaco-modbus"
Issues = "https://github.com/g4bri3lDev/kaco-modbus/issues"

[project.scripts]
kaco-status = "kaco_modbus.status:main"
kaco-query = "kaco_modbus.query:main"

[tool.hatch.version]
path = "src/kaco_modbus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kaco_modbus"]

[dependency-groups]
dev = [
    "modbus-connection[tmodbus]>=4.8.1,<5",
    "rich>=13.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=kaco_modbus --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90
omit = [
    # These open real sockets and print; the presentation helpers in status.py
    # are unit-tested, but the top-level render/poll loops are exercised by
    # hand against the inverter.
    "src/kaco_modbus/query.py",
]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
# Generated from the SunSpec JSON definitions; not worth hand-annotating.
module = "kaco_modbus.models"
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/kaco_modbus/models.py" = ["E501", "RUF", "UP", "B", "SIM"]
